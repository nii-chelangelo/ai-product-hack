# Новый run_id на каждый прогон: шаги закешированы по нему, и повторный запуск со старым id
# переоценит сохранённые evidence, а не проведёт атаку заново.
run_id: llamator-run
target: agent.yaml
campaign: attacks.yaml
# Без judge не будет вердиктов SUCCESS/FAIL и ASR — останутся только структурные сигналы.
judge: judge.yaml
users:
  attacker: user_1001
  # Второй клиент. Без него не снимается замер на чистом агенте и не задаётся вопрос жертве,
  # поэтому разрез cross_session остаётся INCONCLUSIVE.
  victim: user_1002
