[project]
name = "attack-on-agent"
version = "0.1.0"
description = "Defensive-security pipeline for stateful AI-agent testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llamator==3.5.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
]

[project.scripts]
attack-on-agent = "attack_on_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
